services:
  db:
    image: postgres:16-alpine
    container_name: dateno_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-food_ordering_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init_postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dateno_web_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-food_ordering_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      MAIL_EMAIL: ${MAIL_EMAIL:-no-reply@dateno.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-app_password}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-MOMOBKUN20180529}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-klm05TvNBzhg7h7j}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-at67qH6mk8w5Y1nAyMoYKMWACiEi2bsa}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      MOMO_EXCHANGE_RATE: ${MOMO_EXCHANGE_RATE:-25000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
