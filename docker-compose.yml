# DaTeNO: Postgres, Redis, the FastAPI backend and the React app behind nginx.
# Settings come from .env next to this file (see .env.example).
services:
  db:
    image: postgres:16-alpine
    container_name: dateno_postgres_db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
    environment:
      POSTGRES_DB: ${DB_NAME:-dateno}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dateno_redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: dateno_backend
    restart: unless-stopped
    environment:
      # local: OTP emails print to this container's log, MoMo runs in sandbox mode and the
      # local admin is seeded. Use production only behind HTTPS.
      APP_ENV: ${APP_ENV:-local}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      # Set DATABASE_URL yourself when the password needs URL-encoding.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-dateno}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      MEDIA_DIR: /app/media
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_MAX_RETRIES: ${SMTP_MAX_RETRIES:-3}
      MAIL_FROM: ${MAIL_FROM:-}
      EMAIL_WORKER_ENABLED: ${EMAIL_WORKER_ENABLED:-true}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: ./backend
    container_name: dateno_worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-dateno}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MEDIA_DIR: /app/media
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_MAX_RETRIES: ${SMTP_MAX_RETRIES:-3}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - media:/app/media
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: dateno_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      # nginx serves dish photos itself; the backend writes them.
      - media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy

  # Daily database dump and photo archive in ./backups; copy that folder off the server too.
  backup:
    image: postgres:16-alpine
    container_name: dateno_backup
    restart: unless-stopped
    entrypoint: ["/backup.sh"]
    environment:
      POSTGRES_DB: ${DB_NAME:-dateno}
      POSTGRES_USER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - media:/media:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  # Seeded and uploaded dish photos.
  media:
