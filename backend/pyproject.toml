[project]
name = "dateno-backend"
version = "0.1.0"
description = "DaTeNO restaurant ordering API"
authors = [
    { name = "Dương Nguyễn Tấn Đạt", email = "datduongtandat385@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Warnings (leaked sockets, deprecations, lossy Decimal casts) fail the run instead of scrolling by.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations and seed text are not worth hand-wrapping.
"alembic/versions/*" = ["E501"]
