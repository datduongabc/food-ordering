name: Backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    name: Lint and test (Postgres 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dateno_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dateno_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Migrations match models
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dateno_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

      # Both engines: SQLite is what contributors run locally by default, and migrations or
      # SQL that only work on Postgres (e.g. a now() default) must not slip through.
      - name: Tests on SQLite (with coverage, at least 85%)
        run: uv run pytest --cov

      - name: Tests on Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dateno_test
        run: uv run pytest
