name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-test:
    name: PHP Lint, PHPUnit Tests & Coverage (>= 85%)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: food_ordering_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d food_ordering_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 with Xdebug & PostgreSQL Drivers
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, pdo_sqlite
          coverage: xdebug

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install Composer Dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run PHP Syntax Check (Lint)
        run: |
          find app config public tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit Test Suite & Coverage Check (PostgreSQL)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: food_ordering_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          XDEBUG_MODE: coverage
        run: |
          vendor/bin/phpunit --configuration phpunit.xml --coverage-text --coverage-clover=coverage.xml
          php -r '
            $xml = simplexml_load_file("coverage.xml");
            $metrics = $xml->project->metrics;
            $statements = (int)$metrics["statements"];
            $covered = (int)$metrics["coveredstatements"];
            $percent = $statements > 0 ? round(($covered / $statements) * 100, 2) : 0;
            echo "Code Coverage: {$percent}% ({$covered}/{$statements} statements)\n";
            if ($percent < 80) {
                fwrite(STDERR, "Coverage {$percent}% is below the 80% threshold.\n");
                exit(1);
            }
          '

  docker-build:
    name: Docker & Docker Compose Verification
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config -q

      - name: Build Application Docker Image
        run: docker build -t dateno-restaurant:ci .
