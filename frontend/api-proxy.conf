# Shared by every location that forwards to the API; see default.conf.template.
limit_req zone=api burst=60 nodelay;
limit_req_status 429;
error_page 429 = @rate_limited;
error_page 413 = @too_large;

proxy_pass http://backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Overwrite, never append: the API rate-limits by this address, and a client-supplied
# X-Forwarded-For would let anyone pick a fresh one per request.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# The backend logs under this id and returns it as X-Request-ID.
proxy_set_header X-Request-ID $request_id;
# The API sends its own copies of these; keep one set, not two.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
