# Included wherever a location sets its own add_header, since nginx then drops the
# server-level ones. "always" keeps them on error pages too.
# React sets inline styles through the DOM, which style-src does not restrict. connect-src
# lets error reports reach Sentry when VITE_SENTRY_DSN is set.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Add Strict-Transport-Security here once the site is served over HTTPS.
