# Serves the SPA and proxies the API on the same origin, so session and CSRF cookies stay
# first-party, as with the Vite dev server.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Dish photos are capped at 5 MB by the API.
    client_max_body_size 6m;

    include /etc/nginx/security-headers.conf;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Overwrite, never append: the API rate-limits by this address, and a client-supplied
        # X-Forwarded-For would let anyone pick a fresh one per request.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API sends its own copies of these; keep one set, not two.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Vite fingerprints these file names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
