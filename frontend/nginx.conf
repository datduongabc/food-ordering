# Serves the SPA and proxies the API on the same origin, so session and CSRF cookies stay
# first-party, as with the Vite dev server.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Dish photos are capped at 5 MB by the API.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend:8000;
    }

    # Vite fingerprints these file names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
